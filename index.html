<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dopamine 16</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 800;
        }

        header p {
            margin: 10px 0 0;
            font-size: 19px;
            color: #ddd;
        }

        .container {
            width: 92%;
            max-width: 650px;
            margin: 25px auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 27px;
            font-weight: 700;
        }

        .card p {
            margin: 0 0 18px;
            font-size: 18px;
            color: #666;
        }

        .card button {
            border: none;
            background: #222;
            color: white;
            padding: 13px 28px;
            border-radius: 9px;
            font-size: 18px;
            cursor: pointer;
        }

        .card button:active {
            transform: scale(0.96);
        }

        @media (max-width: 500px) {

            header h1 {
                font-size: 34px;
            }

            header p {
                font-size: 18px;
            }

            .card h2 {
                font-size: 25px;
            }

            .card p {
                font-size: 17px;
            }

            .card button {
                font-size: 18px;
                padding: 13px 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Dopamine 16</h1>
        <p>Study Materials for Students</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>VAC Ayurveda</h2>

    <button>Open</button>
</a>
        </div>

    </a>
</div>

        <div class="card">

        <button>Open</button>
    </a>
</div>

     
<div class="card">

<div class="card">
